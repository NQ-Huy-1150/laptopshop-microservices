spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:mysql://localhost:3306/laptopshop_profile
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/laptopshop
  logging:
    level:
      org.springframework.security: DEBUG
server:
  port: 8087
  servlet:
    context-path: /profile

app:
  keycloak-url: http://localhost:8180
  client_id: ${CLIENT_ID}
  client_secret: ${CLIENT_SECRET}